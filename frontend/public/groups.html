<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Группы</title>
    <script src="storage.js" defer></script>
    <script src="groups.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
</head>
<body>
    <nav>
        <h1>
            <a href="/">
                <img src="logo.png" alt="Nexus" class="site-logo">
            </a>
        </h1>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="students.html">Ученики</a></li>
            <li><a href="groups.html" class="active">Группы</a></li>
        </ul>
    </nav>
    <div class="columns">
        <section>
            <div class="head-form">
                <h3>Добавить группу</h3>
                <form id="group-form">
                    <label>
                        Название:
                        <input type="text" name="name" placeholder="Название">
                    </label>
                    <button type="submit">Добавить</button>
                </form>
            </div>

            <h3>Список</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody id="group-tbody">

                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
