name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...